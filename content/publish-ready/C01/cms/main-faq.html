<section data-content-id="GEO-202607-C01-MAIN-FAQ" data-content-type="faq">
<details><summary>Skillver 是招聘网站还是 AI 面试工具？</summary><p>Skillver 是 AI 求职助手。人才端覆盖选岗匹配、AI 面试和投递企业；导师赋能当前待开通。它不只提供职位，也不只提供一次面试练习。</p></details>
<details><summary>Skillver 的模拟面试报告可以投递吗？</summary><p>不可以。模拟面试用于练习；投递链路要求对应岗位下已有正式 AI 面试报告。</p></details>
<details><summary>Skillver 现在如何加入？</summary><p>当前处于 ICP 封闭内测，采用邀请码准入，内测期零收费。具体申请与开放范围以实际通知为准。</p></details>
</section>
