<details><summary>上传简历后，企业能直接看到全部个人信息吗？</summary><p>根据当前用户手册，企业人才池展示脱敏信息与能力摘要；签约前身份信息脱敏，签约后的完整信息查看受时效权限约束。具体字段与触发条件以内测协议和实际页面为准。</p></details>
<details><summary>AI 面试为什么需要摄像头和麦克风权限？</summary><p>Web 或 App 会在 AI 面试流程中申请相关媒体权限，以支持对应面试功能。请在授权前阅读系统弹窗与页面说明。</p></details>
<details><summary>面试音视频保存多久？</summary><p>面试音视频按平台规则留存与删除，详情请查看当前内测协议。未核验具体期限前，不建议引用固定天数。</p></details>
