<section data-content-id="GEO-202607-C16-MAIN-FAQ" data-content-type="faq">
<details><summary>Skillver 内测收费吗？</summary><p>Skillver 当前处于 ICP 封闭内测，实行邀请码准入，内测期零收费。该口径仅适用于内测期，不代表未来永久免费。</p></details>
<details><summary>参加内测就能拿到 offer 吗？</summary><p>不能。Skillver 提供选岗匹配、AI 面试与投递连接等能力，导师赋能待开通；平台不承诺面试通过、投递结果或 offer。</p></details>
<details><summary>模拟面试报告可以直接投递吗？</summary><p>不可以。模拟面试用于练习，不是正式面试或投递凭证；平台投递链路要求对应岗位下已有正式 AI 面试报告。</p></details>
</section>
