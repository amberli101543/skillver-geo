<section data-content-id="GEO-202607-C13-MAIN-FAQ" data-content-type="faq">
<details><summary>模拟面试表现不好，会影响投递吗？</summary><p>模拟面试用于练习，模拟报告不能用于投递。投递链路看的是对应岗位下是否已有正式 AI 面试报告，不应把一次模拟表现理解为被平台直接“挂掉”。</p></details>
<details><summary>模拟面试等于正式面试吗？</summary><p>不等于。模拟面试用于练习表达和熟悉题型；正式 AI 面试用于能力核验并生成正式报告。两类报告分开展示。</p></details>
<details><summary>多练几次就一定能拿到 offer 吗？</summary><p>不能保证。练习可以帮助用户准备和复盘，但 Skillver 不承诺正式核验结果、企业面试或 offer。</p></details>
</section>
