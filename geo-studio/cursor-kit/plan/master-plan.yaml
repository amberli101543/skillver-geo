workflow:
  entry_doc: docs/DEVELOPMENT-PLAN.md
  progress_doc: docs/PROGRESS.md
  on_task_start: "Update PROGRESS.md current focus + spec status IMPLEMENTING"
  on_task_done: "Run test, typecheck, check:architecture; update PROGRESS + master-plan"
  on_spec_done: "Set spec status DONE in specs/*.yaml and master-plan"

validation_commands:
  test: npm --prefix backend test
  typecheck: npm --prefix backend run typecheck
  architecture: npm --prefix backend run check:architecture
  build: npm --prefix web run build
