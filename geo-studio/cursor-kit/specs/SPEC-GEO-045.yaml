  replay_cases: []

  notes: |
    Phase 7 P1 — 基于矩阵单元构造验证问题，单题引擎试跑 + 评分。
    verification 持久化于 content_drafts.verification JSONB；生成 Job 结束后自动验证。
    direction: favorable | neutral | needs_improvement

  approval_required: true
