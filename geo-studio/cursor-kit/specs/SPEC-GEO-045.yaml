  parent_plan: phase-7-capability-depth
  depends_on: [SPEC-GEO-044, SPEC-GEO-037, SPEC-GEO-041]

  affected_files:
    - backend/prisma/schema.prisma
    - backend/prisma/migrations/20260613030000_content_draft_verification/migration.sql
    - backend/src/content/content-verification.ts
    - backend/src/content/content-verification.test.ts
    - backend/src/content/content-draft.ts
    - backend/src/content/content-draft.repository.ts
    - backend/src/content/content-draft.service.ts
    - backend/src/content/content.controller.ts
    - backend/src/content/content.module.ts
    - backend/src/content/content-draft.service.test.ts
    - backend/src/content/content.controller.e2e.test.ts
    - web/src/api.ts
    - web/src/DraftEditor.tsx
    - web/src/DraftVerificationPanel.tsx
    - web/src/styles.css
    - docs/PROGRESS.md

  validation_rules:
    - "npm --prefix backend test PASS"
    - "npm --prefix backend run check:architecture PASS"
    - "npm --prefix web run build PASS"
    - "generate 完成后 draft 含 verification（direction / summary / hints）"
