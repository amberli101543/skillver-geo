spec:
  id: SPEC-GEO-036
  version: v0.1.0
  status: DONE
  type: feature
  feature_goal: "RAG 产品化：断言/品牌资料自动索引，pgvector 检索，生成与评分稳定引用知识片段"

  parent_plan: phase-5-platform-alignment
  depends_on: [SPEC-GEO-ARCH-003]

  affected_files:
    - backend/src/ai/rag/
    - backend/src/brand/brand-entity.service.ts
    - backend/prisma/schema.prisma
    - backend/prisma/migrations/
    - docs/ARCHITECTURE.md

  validation_rules:
    - "npm --prefix backend test PASS"
    - "RAG 逻辑仅在 backend/src/ai/ 下"
    - "Assertion 增删改后 BrandKnowledgeChunk 自动同步"
    - "retrieve 使用 pgvector（或等效 DB 向量索引），非全表 JSON 扫描"

  replay_cases: []

  notes: |
    ARCH-003 已交付 Repository + Facade 挂钩；本 SPEC 补齐产品闭环与存储目标态。
    **产品决策（2026-06-13）**：启用 pgvector；开发/生产 PostgreSQL 使用 pgvector 镜像。
    - 迁移：CREATE EXTENSION vector；embedding 列改为 vector 类型 + ivfflat/hnsw 索引
    - 在 brand-entity 层 assertion CRUD 后调用 RagService.syncAssertions（经 ai/ 导出或事件，不 skip 层）
    - 可选：品牌 definition/positioning 写入 sourceType=brand
    - 无 Key 时 keyword fallback 行为保留，与 v1 兼容

  approval_required: true
