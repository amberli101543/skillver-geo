spec:
  id: SPEC-GEO-042
  version: v0.1.0
  status: DONE
  type: feature
  feature_goal: "Job/队列运维看板：展示 GET /jobs/stats 与最近任务状态"

  parent_plan: phase-6-product-exposure
  depends_on: [SPEC-GEO-038]

  affected_files:
    - backend/src/worker/job.service.ts
    - backend/src/worker/job.repository.ts
    - backend/src/worker/job.types.ts
    - web/src/api.ts
    - web/src/Dashboard.tsx
    - web/src/JobQueuePanel.tsx
    - web/src/styles.css
    - docs/API-ENDPOINTS.md

  validation_rules:
    - "npm --prefix web run build PASS"
    - "看板可展示 pending/running/completed/failed 计数与 queueMode"
    - "可选：轮询刷新 stats（间隔可配置或 10s 默认）"

  replay_cases: []

  notes: |
    GEO-038 已在 API 暴露 GET /jobs/stats；本 SPEC 前端 Panel + stats 响应 recentJobs（最近 10 条）。
    - JobQueuePanel：状态计数、queueMode、最近任务表
    - 默认 10s 轮询；VITE_JOB_STATS_POLL_MS 可配置
    - 无分页 LIST /jobs API

  approval_required: true
