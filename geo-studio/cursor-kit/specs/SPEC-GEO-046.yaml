    - backend/src/distribution/distribution-impact.test.ts
    - backend/src/distribution/distribution.service.ts
    - backend/src/distribution/distribution.controller.ts
    - backend/src/distribution/distribution.module.ts
    - backend/src/distribution/distribution.controller.e2e.test.ts
    - web/src/api.ts
