services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: geo-studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo
      POSTGRES_DB: geo_studio
    ports:
      - "5433:5432"
    volumes:
      - geo_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: geo-studio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - geo_redis_data:/data

volumes:
  geo_pg_data:
  geo_redis_data:
